[workspace]
resolver = "2"
members = ["crates/*"]

# ワークスペース共通設定。全 crate はここを継承する。
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oboro-app/oboro-ukeire"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
